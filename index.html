<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palestra: Nutrição e Saúde na Melhor Idade</title>
    <style>
        :root {
            --primary-color: #1e88e5;
            --secondary-color: #43a047;
            --bg-color: #f5f9ff;
            --text-color: #333;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 1000px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .header {
            display: flex;
            align-items: center;
            border-bottom: 4px solid var(--secondary-color);
            padding-bottom: 15px;
            gap: 15px;
        }

        .header h1 {
            font-size: 2.2rem;
            color: var(--primary-color);
            margin: 0;
            flex-grow: 1;
        }

        .slide-content {
            display: flex;
            flex-direction: column;
            gap: 30px;
            min-height: 450px;
        }

        @media (min-width: 768px) {
            .slide-content {
                flex-direction: row;
                align-items: stretch;
            }
            .slide-image {
                flex: 1;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .slide-text {
                flex: 1;
                display: flex;
                flex-direction: column;
                justify-content: center;
            }
        }

        .slide-image img {
            width: 100%;
            height: 100%;
            max-height: 400px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            object-fit: cover;
        }

        .slide-text {
            font-size: 1.35rem;
            line-height: 1.7;
            background-color: #f0f7f0;
            padding: 30px;
            border-radius: 15px;
            border-left: 8px solid var(--secondary-color);
        }

        .slide-text h2 {
            margin-top: 0;
            color: var(--primary-color);
            font-size: 1.8rem;
            margin-bottom: 20px;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #eee;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 15px 35px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.2rem;
            font-weight: bold;
            transition: all 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        button:hover {
            background-color: #1565c0;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }

        button:disabled {
            background-color: #90caf9;
            cursor: not-allowed;
            transform: translateY(0);
            box-shadow: none;
        }

        .progress {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--text-color);
            background: #e3f2fd;
            padding: 10px 20px;
            border-radius: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>🌟 Saúde e Qualidade de Vida</h1>
        </div>
        
        <div class="slide-content" id="slide-display">
            </div>

        <div class="controls">
            <button id="btn-prev" onclick="changeSlide(-1)">⬅️ Voltar</button>
            <div class="progress" id="progress-text">1 / 10</div>
            <button id="btn-next" onclick="changeSlide(1)">Avançar ➡️</button>
        </div>
    </div>

    <script>
        const slides = [
            {
                title: "Sejam muito bem-vindos!",
                text: "Hoje vamos ter uma conversa muito especial sobre como pequenas escolhas diárias podem transformar a nossa saúde e nos dar mais disposição. O nosso objetivo aqui não é falar difícil, mas sim mostrar caminhos práticos para vivermos mais e vivermos melhor. Vamos juntos?",
                image: "https://images.unsplash.com/photo-1505576399279-565b52d4ac71?auto=format&fit=crop&w=800&q=80"
            },
            {
                title: "Por que a boa alimentação importa tanto?",
                text: "O nosso corpo é como uma máquina que precisa do combustível certo. Na melhor idade, o corpo absorve menos nutrientes e perde massa muscular mais rápido. É por isso que precisamos comer bem: para ter energia, proteger a memória, o coração e, principalmente, manter os músculos e ossos fortes para termos nossa independência.",
                image: "https://images.unsplash.com/photo-1490645935967-10de6ba17061?auto=format&fit=crop&w=800&q=80"
            },
            {
                title: "Como montar o prato ideal?",
                text: "É mais simples do que parece! Metade do prato deve ser bem colorida, com verduras e legumes para fortalecer a imunidade. Um quarto do prato vai para a energia: o arroz, a batata ou a mandioca. O último quarto é importantíssimo: as proteínas. Ovos, feijão, frango ou peixe são os 'tijolinhos' que mantêm a força dos nossos músculos.",
                image: "https://images.unsplash.com/photo-1512621776951-a57141f2eefd?auto=format&fit=crop&w=800&q=80"
            },
            {
                title: "O que devemos evitar?",
                text: "Não precisamos proibir nada, mas precisamos ter equilíbrio. Muito açúcar atrapalha o controle da glicose. O excesso de sal aumenta a pressão arterial. E as frituras ou alimentos de pacotinho, cheios de conservantes, acabam inflamando e sobrecarregando o nosso organismo. Vamos focar na comida de verdade!",
                image: "https://images.unsplash.com/photo-1621939514649-280e2ee25f60?auto=format&fit=crop&w=800&q=80"
            },
            {
                title: "A importância da hidratação",
                text: "Você sabia que na melhor idade a gente sente menos sede? Por isso, não podemos esperar a boca secar para beber água. A água ajuda o intestino a funcionar, previne dores de cabeça e protege os rins. Deixe sempre uma garrafinha por perto. Chás sem açúcar também são ótimos. Só precisamos evitar os refrigerantes.",
                image: "https://images.unsplash.com/photo-1523362628745-0c100150b504?auto=format&fit=crop&w=800&q=80"
            },
            {
                title: "Corpo em movimento!",
                text: "Nosso corpo foi feito para se mexer! Caminhadas pelo bairro, alongamentos em casa ou atividades leves ajudam a melhorar o equilíbrio e evitar quedas. Uma musculatura firme protege as articulações e nos dá autonomia para fazer as coisas que amamos sem precisar de ajuda.",
                image: "https://images.unsplash.com/photo-1544367567-0f2fcb009e0b?auto=format&fit=crop&w=800&q=80"
            },
            {
                title: "Alegria e Dança",
                text: "A dança é um santo remédio! Ela trabalha o corpo e a mente ao mesmo tempo, melhora o nosso humor, espanta o estresse e nos ajuda a fazer amigos. Coloque uma música que você gosta em casa, afaste os móveis e movimente-se. É saúde pura em forma de alegria.",
                image: "https://images.unsplash.com/photo-1511895426328-dc8714191300?auto=format&fit=crop&w=800&q=80"
            },
            {
                title: "Mente ativa sempre",
                text: "Assim como o corpo, o cérebro precisa de exercícios. Ler um livro, fazer palavras cruzadas, jogar dominó ou cartas com os amigos, e até aprender uma coisa nova ajuda a manter a memória afiada e a concentração lá em cima. Uma mente ativa é o segredo de um envelhecimento saudável.",
                image: "https://images.unsplash.com/photo-1531844251246-9a1bfaae09fc?auto=format&fit=crop&w=800&q=80"
            },
            {
                title: "O poder do convívio familiar",
                text: "Comer acompanhado, dar risada com a família ou conversar com vizinhos e amigos é alimento para a alma. O carinho e a interação social reduzem a tristeza e melhoram até o apetite. Não se trata apenas de quantos anos vamos viver, mas da qualidade e da alegria de cada um desses anos.",
                image: "https://images.unsplash.com/photo-1581579186913-46bcbc60e201?auto=format&fit=crop&w=800&q=80"
            },
            {
                title: "Receita Prática: Mingau Nutritivo",
                text: "Para terminar, uma receita fácil!<br><br><strong>Mingau de Aveia:</strong> Misture em uma panela 3 colheres de aveia e 1 xícara de leite. Mexa até engrossar. Desligue e coloque meia banana amassada e um pouco de canela.<br><br><em>Por que é bom?</em> A aveia faz o intestino funcionar como um reloginho, a banana dá energia e a receita é super fácil de mastigar e engolir. Façam em casa!",
                image: "https://images.unsplash.com/photo-1505253758473-96b7015fcd40?auto=format&fit=crop&w=800&q=80"
            }
        ];

        let currentSlide = 0;
        const slideDisplay = document.getElementById('slide-display');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');
        const progressText = document.getElementById('progress-text');

        function updateUI() {
            const slide = slides[currentSlide];
            
            // Troca o conteúdo da tela com os textos fáceis e as imagens prontas
            slideDisplay.innerHTML = `
                <div class="slide-image">
                    <img src="${slide.image}" alt="Imagem ilustrativa da palestra">
                </div>
                <div class="slide-text">
                    <h2>${slide.title}</h2>
                    <p>${slide.text}</p>
                </div>
            `;

            btnPrev.disabled = currentSlide === 0;
            
            if (currentSlide === slides.length - 1) {
                btnNext.innerText = "Finalizar 🎉";
                btnNext.disabled = true;
            } else {
                btnNext.innerText = "Avançar ➡️";
                btnNext.disabled = false;
            }

            progressText.innerText = `Etapa ${currentSlide + 1} de ${slides.length}`;
        }

        function changeSlide(direction) {
            currentSlide += direction;
            if (currentSlide < 0) currentSlide = 0;
            if (currentSlide >= slides.length) currentSlide = slides.length - 1;
            updateUI();
        }

        // Carrega a primeira tela imediatamente
        updateUI();
    </script>
</body>
</html>
