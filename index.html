<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palestra: Nutrição e Movimento na Melhor Idade</title>
    <style>
        :root {
            --primary-color: #0277bd;
            --secondary-color: #ff9800;
            --bg-color: #f0f4f8;
            --text-color: #2c3e50;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 1100px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .header {
            display: flex;
            align-items: center;
            border-bottom: 4px solid var(--secondary-color);
            padding-bottom: 15px;
            gap: 15px;
        }

        .header h1 {
            font-size: 2.2rem;
            color: var(--primary-color);
            margin: 0;
            flex-grow: 1;
        }

        .slide-content {
            display: flex;
            flex-direction: column;
            gap: 30px;
            min-height: 500px;
        }

        @media (min-width: 768px) {
            .slide-content {
                flex-direction: row;
                align-items: stretch;
            }
            .slide-image {
                flex: 1;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .slide-text {
                flex: 1.2;
                display: flex;
                flex-direction: column;
                justify-content: center;
                max-height: 550px;
                overflow-y: auto;
            }
        }

        .slide-image img {
            width: 100%;
            height: 100%;
            max-height: 450px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            object-fit: cover;
        }

        .slide-text {
            font-size: 1.2rem;
            line-height: 1.6;
            background-color: #fff9f0;
            padding: 30px;
            border-radius: 15px;
            border-left: 8px solid var(--secondary-color);
        }

        .slide-text h2 {
            margin-top: 0;
            color: var(--primary-color);
            font-size: 1.8rem;
            margin-bottom: 15px;
        }

        .slide-text strong {
            color: #d84315;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #eee;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 15px 35px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.2rem;
            font-weight: bold;
            transition: all 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        button:hover {
            background-color: #01579b;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }

        button:disabled {
            background-color: #81d4fa;
            cursor: not-allowed;
            transform: translateY(0);
            box-shadow: none;
        }

        .progress {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--primary-color);
            background: #e1f5fe;
            padding: 10px 20px;
            border-radius: 20px;
        }

        /* Scrollbar customizada para o texto */
        .slide-text::-webkit-scrollbar {
            width: 8px;
        }
        .slide-text::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        .slide-text::-webkit-scrollbar-thumb {
            background: #ffb74d;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>🧠 Corpo e Mente na Melhor Idade</h1>
        </div>
        
        <div class="slide-content" id="slide-display">
            </div>

        <div class="controls">
            <button id="btn-prev" onclick="changeSlide(-1)">⬅️ Voltar</button>
            <div class="progress" id="progress-text">1 / 10</div>
            <button id="btn-next" onclick="changeSlide(1)">Avançar ➡️</button>
        </div>
    </div>

    <script>
        const slides = [
            {
                title: "Bem-vindos à nossa conversa!",
                text: "Hoje, como nutricionista e educadora física, não vim apenas dizer 'o que' vocês devem fazer, mas explicar o <strong>'porquê'</strong>. Quando entendemos como nosso corpo muda com o tempo, fica muito mais fácil cuidar dele. Vamos descobrir como a alimentação e o movimento são os melhores remédios que existem!",
                image: "https://images.unsplash.com/photo-1573497620053-ea5300f94f21?auto=format&fit=crop&w=800&q=80"
            },
            {
                title: "O Mistério da Sede: Por que esquecemos de beber água?",
                text: "<strong>A Causa:</strong> No nosso cérebro, existe um 'sensor' (o hipotálamo) que avisa quando o corpo precisa de água. Com a idade, esse sensor envelhece e perde a sensibilidade. A água falta, mas o cérebro não avisa!<br><br><strong>O Perigo:</strong> Desidratação silenciosa. Causa confusão mental, infecção urinária, intestino preso e quedas de pressão.<br><br><strong>A Cura:</strong> Beber água <em>pelo relógio</em>, e não pela sede. Tenha uma garrafinha de 1,5L e coloque como meta esvaziá-la até o fim do dia.",
                image: "https://images.unsplash.com/photo-1523362628745-0c100150b504?auto=format&fit=crop&w=800&q=80"
            },
            {
                title: "Por que perdemos Massa Muscular?",
                text: "<strong>A Causa:</strong> Esse processo se chama <em>Sarcopenia</em>. Com a idade, nossos hormônios diminuem e nosso corpo fica mais 'preguiçoso' para transformar a proteína da comida em músculo. Além disso, nos movimentamos menos.<br><br><strong>O Perigo:</strong> Músculos fracos deixam os ossos e as articulações desprotegidos, causando dores nos joelhos, coluna e aumentando o risco de quedas graves.<br><br><strong>A Cura:</strong> Consumir proteínas em <em>todas</em> as refeições (ovos, leite, frango) e, obrigatoriamente, fazer exercícios de força.",
                image: "https://images.unsplash.com/photo-1571019614242-c5c5dee9f50b?auto=format&fit=crop&w=800&q=80"
            },
            {
                title: "A Farmácia do Intestino",
                text: "<strong>A Causa:</strong> O intestino fica mais lento na melhor idade porque há diminuição dos movimentos peristálticos (a contração que empurra o alimento) e, muitas vezes, mastigamos menos por problemas dentários.<br><br><strong>A Cura pelas Boas Práticas:</strong> Precisamos da tríade: <strong>Água + Fibras + Movimento</strong>. Fibras (mamão, aveia, folhas) formam o 'bolo', a água hidrata e deixa macio, e a caminhada 'balança' o intestino, fazendo-o funcionar como um reloginho.",
                image: "https://images.unsplash.com/photo-1490645935967-10de6ba17061?auto=format&fit=crop&w=800&q=80"
            },
            {
                title: "Açúcar e Sal: O que eles fazem lá dentro?",
                text: "<strong>Açúcar:</strong> Causa picos de insulina e 'cansa' o pâncreas, levando ao diabetes. Também inflama as articulações, piorando dores.<br><br><strong>Sal:</strong> O excesso de sódio faz o corpo reter água, o que aumenta o volume de sangue nas veias, estourando a pressão (Hipertensão).<br><br><strong>A Cura:</strong> Troque o sal por temperos naturais (alho, cebola, orégano, açafrão, que é um poderoso anti-inflamatório). Para o doce, frutas assadas com canela enganam a vontade do cérebro.",
                image: "https://images.unsplash.com/photo-1621939514649-280e2ee25f60?auto=format&fit=crop&w=800&q=80"
            },
            {
                title: "O Remédio chamado Movimento",
                text: "<strong>Como Educadora Física, eu afirmo:</strong> O corpo é uma máquina que enferruja se parar. Não basta só caminhar! A caminhada é ótima para o coração, mas precisamos de <em>Força e Equilíbrio</em>.<br><br><strong>A Cura:</strong> Exercícios com pesinhos (pode ser garrafa PET com água) ou elásticos. O músculo puxa o osso durante o exercício, e isso faz o osso ficar mais duro e forte, prevenindo a osteoporose. O movimento lubrifica as articulações, tirando a 'ferrugem' e a dor.",
                image: "https://images.unsplash.com/photo-1544367567-0f2fcb009e0b?auto=format&fit=crop&w=800&q=80"
            },
            {
                title: "Cérebro em Ação: O Poder da Dança",
                text: "<strong>O que acontece:</strong> Quando envelhecemos, algumas conexões nervosas do cérebro se apagam, afetando a memória. <br><br><strong>Por que a Dança Cura?</strong> Dançar exige decorar os passos (memória), equilibrar o corpo (motor) e escutar o ritmo (audição). O cérebro precisa criar <em>novas pontes</em> para dar conta de tudo isso! Sem falar nas endorfinas (hormônios da felicidade) liberadas ao sorrir e socializar. É o melhor exercício mental e físico.",
                image: "https://images.unsplash.com/photo-1511895426328-dc8714191300?auto=format&fit=crop&w=800&q=80"
            },
            {
                title: "A Força da Convivência",
                text: "Nós somos seres sociais. O isolamento aumenta os níveis de cortisol (hormônio do estresse), que literalmente destrói nossos músculos e abaixa nossa imunidade.<br><br><strong>A Cura:</strong> Comer junto com a família, ir a grupos de convivência, conversar. Rir e abraçar libera ocitocina, um hormônio que protege o coração e melhora o apetite.",
                image: "https://images.unsplash.com/photo-1581579186913-46bcbc60e201?auto=format&fit=crop&w=800&q=80"
            },
            {
                title: "Receita 1: Super Vitamina Pró-Músculo",
                text: "Lembra que falamos da Sarcopenia (perda de músculo)? Essa receita é a cura!<br><br><strong>Ingredientes:</strong> 1 copo de leite, 1 colher de leite em pó (ou suplemento proteico se o médico indicar), 1 banana, 1 colher de aveia e 1 castanha do pará.<br><br><strong>Por que funciona?</strong> É uma explosão de proteínas fáceis de digerir. A castanha tem selênio, ótimo para a memória. A banana previne cãibras. Bata tudo e tome no lanche da tarde!",
                image: "https://images.unsplash.com/photo-1623065422902-30a2d299bbe4?auto=format&fit=crop&w=800&q=80"
            },
            {
                title: "Receita 2: Omelete Anti-inflamatório",
                text: "Para um jantar leve, nutritivo e que cuida das articulações.<br><br><strong>Ingredientes:</strong> 2 ovos, 1 punhado de espinafre, 1 pitada de açafrão da terra (cúrcuma) e tomate picado.<br><br><strong>Por que funciona?</strong> O ovo é a segunda melhor proteína do mundo (só perde para o leite materno). O açafrão atua nas juntas inflamadas como um remédio natural. E é molinho, fácil de mastigar e não pesa no estômago à noite. Façam e me contem!",
                image: "https://images.unsplash.com/photo-1510693208761-0b5c19777178?auto=format&fit=crop&w=800&q=80"
            }
        ];

        let currentSlide = 0;
        const slideDisplay = document.getElementById('slide-display');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');
        const progressText = document.getElementById('progress-text');

        function updateUI() {
            const slide = slides[currentSlide];
            
            slideDisplay.innerHTML = `
                <div class="slide-image">
                    <img src="${slide.image}" alt="Imagem ilustrativa da palestra">
                </div>
                <div class="slide-text">
                    <h2>${slide.title}</h2>
                    <p>${slide.text}</p>
                </div>
            `;

            btnPrev.disabled = currentSlide === 0;
            
            if (currentSlide === slides.length - 1) {
                btnNext.innerText = "Finalizar 🎉";
                btnNext.disabled = true;
            } else {
                btnNext.innerText = "Avançar ➡️";
                btnNext.disabled = false;
            }

            progressText.innerText = `Slide ${currentSlide + 1} de ${slides.length}`;
        }

        function changeSlide(direction) {
            currentSlide += direction;
            if (currentSlide < 0) currentSlide = 0;
            if (currentSlide >= slides.length) currentSlide = slides.length - 1;
            updateUI();
        }

        updateUI();
    </script>
</body>
</html>
